services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plp-demo-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: plp_demo
      DB_USERNAME: plp_user
      DB_PASSWORD: plp_password
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      MAIL_DRIVER: log
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:5.7
    container_name: plp-demo-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: plp_demo
      MYSQL_USER: plp_user
      MYSQL_PASSWORD: plp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: plp-demo-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 256M
    depends_on:
      mysql:
        condition: service_healthy

  node:
    image: node:14-bullseye
    container_name: plp-demo-node
    working_dir: /var/www/html
    profiles:
      - assets
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"

volumes:
  mysql_data:
