<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#006837">
    <title>PLP Portal - Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: linear-gradient(145deg, #eff8f2, #ffffff 55%);
            color: #173c29;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        main {
            background: #fff;
            border: 1px solid #dce7e0;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 68, 36, .12);
            max-width: 440px;
            padding: 32px 28px;
            width: 100%;
        }
        img { height: 112px; margin-bottom: 18px; width: 112px; }
        h1 { font-size: 1.45rem; margin: 0 0 10px; }
        p { color: #607267; line-height: 1.55; margin: 0 0 22px; }
        button {
            background: #006837;
            border: 0;
            border-radius: 9px;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            min-height: 44px;
            padding: 10px 22px;
        }
    </style>
</head>
<body>
    <main>
        <img src="pwa/icon-192.png" alt="PLP seal">
        <h1>You’re offline</h1>
        <p>The PLP Portal needs a network connection to load account information safely. Reconnect, then try again.</p>
        <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
</body>
</html>
